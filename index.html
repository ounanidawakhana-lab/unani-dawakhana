<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unani Dawakhana Official | Premium Herbal Marketplace</title>
  <meta name="description" content="Fast, modern herbal e‑commerce experience inspired by Zepto. Browse premium Unani products, offers and quick order options.">
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- CSS Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app-root"></main>

  <!-- Cart Drawer -->
  <div class="cart-drawer" id="cart-drawer">
    <div class="cart-header">
      <h3>Your Cart (<span id="cart-drawer-count">0</span>)</h3>
      <button class="cart-close" onclick="closeCartDrawer()">×</button>
    </div>
    <div class="cart-items" id="cart-items-container"></div>
    <div class="cart-footer-details" id="cart-footer-details" style="display:none; flex-direction:column; gap:16px;">
      <div style="display:flex; justify-content:space-between; font-weight:700; font-size:1.1rem; color:var(--primary);">
        <span>Subtotal</span>
        <span id="cart-subtotal">₹0</span>
      </div>
      <button class="btn btn-primary" style="width:100%;" onclick="openCheckoutModal()">Proceed to Checkout</button>
    </div>
  </div>

  <!-- Checkout Modal -->
  <div class="checkout-modal-overlay" id="checkout-modal">
    <div class="checkout-modal">
      <div class="checkout-header">
        <h3 style="color:var(--primary); font-size:1.3rem;">Complete Your Order</h3>
        <button class="checkout-close" onclick="closeCheckoutModal()">×</button>
      </div>
      <div class="checkout-body">
        <form id="checkout-form">
          <div class="form-group">
            <label>Full Name *</label>
            <input type="text" id="chk-name" required placeholder="Enter your name">
          </div>
          <div class="form-group">
            <label>Phone Number *</label>
            <input type="tel" id="chk-phone" required placeholder="10-digit mobile number">
          </div>
          <div class="form-group">
            <label>Delivery Address *</label>
            <textarea id="chk-address" rows="2" required placeholder="House No, Street, Landmark"></textarea>
          </div>
          <div class="form-grid" style="grid-template-columns: 1fr 1fr;">
            <div class="form-group">
              <label>City *</label>
              <input type="text" id="chk-city" required placeholder="City name">
            </div>
            <div class="form-group">
              <label>Pincode *</label>
              <input type="text" id="chk-pincode" required placeholder="6 digit pin">
            </div>
          </div>
          <div class="form-group" style="margin-top: 10px;">
            <label style="font-size:1.1rem; color:var(--primary); margin-bottom:12px;">Payment Mode</label>
            <div class="payment-options">
              <label class="payment-option">
                <input type="radio" name="payment_mode" value="COD" checked> Cash on Delivery (COD)
              </label>
              <label class="payment-option">
                <input type="radio" name="payment_mode" value="WhatsApp"> Pay via WhatsApp Support
              </label>
            </div>
          </div>
          <button type="submit" class="btn btn-primary" style="width:100%; font-size:1.1rem; margin-top:16px;">Place Order Now</button>
        </form>
      </div>
    </div>
  </div>

  <!-- Bottom App Navigation -->
  <nav class="app-bottom-nav">
    <a href="#home" class="nav-btn active">
      <div class="nav-icon">🏠</div>
      <span>Home</span>
    </a>
    <a href="#categories" class="nav-btn" onclick="document.querySelector('.category-scroll').scrollIntoView({behavior: 'smooth'})">
      <div class="nav-icon">🗂️</div>
      <span>Categories</span>
    </a>
    <a href="#trending" class="nav-btn" onclick="setStoreCategory('Combo')">
      <div class="nav-icon">📈</div>
      <span>Trending</span>
    </a>
    <a href="#" class="nav-btn" onclick="openCartDrawer()">
      <div class="nav-icon" style="position:relative;">
        🛒
        <span class="nav-badge" id="cart-badge-count" style="position:absolute; top:-6px; right:-8px; background:#e91e63; color:#fff; border-radius:50%; width:16px; height:16px; font-size:0.6rem; display:flex; align-items:center; justify-content:center; font-weight:bold;">0</span>
      </div>
      <span>Cart</span>
    </a>
  </nav>

  <!-- Sticky WhatsApp Button -->
  <a href="https://wa.me/918796982661?text=Hello%20Unani%20Dawakhana,%20I%20would%20like%20to%20know%20more%20about%20your%20products." class="floating-whatsapp-btn" target="_blank" aria-label="Chat on WhatsApp">
    <svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L0 24l6.335-1.662c1.746.953 3.71 1.455 5.703 1.458h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413z"/></svg>
  </a>

  <!-- Scripts -->
  <script src="script.js"></script>
</body>
</html>
