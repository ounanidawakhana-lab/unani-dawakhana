<body>
  <!-- Splash Screen -->
  <div id="splash-screen" style="position:fixed; top:0; left:0; width:100%; height:100%; background:var(--primary); z-index:9999; display:flex; flex-direction:column; align-items:center; justify-content:center; transition:opacity 0.5s ease;">
    <div style="font-size:4rem; animation:splash-pulse 1s infinite alternate;">🌿</div>
    <h1 style="color:#fff; font-family:'Outfit',sans-serif; margin-top:1rem; letter-spacing:1px;">Unani Dawakhana</h1>
  </div>

  <main id="app-root"></main>

  <!-- Cart Drawer -->
  <div class="cart-drawer" id="cart-drawer">
    <div class="cart-header">
      <h3>Your Cart (<span id="cart-drawer-count">0</span>)</h3>
      <button class="cart-close" onclick="closeCartDrawer()">×</button>
    </div>
    <div class="cart-items" id="cart-items-container"></div>
    <div class="cart-footer-details" id="cart-footer-details" style="display:none; flex-direction:column; gap:16px;">
      
      <!-- Bill Details Section -->
      <div style="background: var(--primary-ultra-light); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 8px; font-size: 0.9rem;">
        <h4 style="font-weight: 700; color: var(--primary); margin-bottom: 4px; font-size: 1rem;">Bill Details</h4>
        <div style="display:flex; justify-content:space-between; color: var(--text-muted);">
          <span>Item Total</span>
          <span id="cart-item-total">₹0</span>
        </div>
        <div style="display:flex; justify-content:space-between; color: var(--text-muted);">
          <span>Delivery Fee</span>
          <div><span style="text-decoration: line-through; margin-right: 6px; font-size: 0.8rem;">₹40</span><span style="color: green; font-weight: 600;">FREE</span></div>
        </div>
        <div style="display:flex; justify-content:space-between; color: var(--text-muted);">
          <span>Platform Fee</span>
          <span>₹5</span>
        </div>
        <div style="display:flex; justify-content:space-between; color: var(--text-muted);">
          <span>GST / Taxes</span>
          <span>Included</span>
        </div>
        <div style="height: 1px; background: rgba(0,0,0,0.1); margin: 4px 0;"></div>
        <div style="display:flex; justify-content:space-between; font-weight:700; font-size:1.1rem; color: var(--text-main);">
          <span>To Pay</span>
          <span id="cart-subtotal">₹0</span>
        </div>
      </div>

      <button class="btn btn-primary" onclick="openCheckout()" style="width:100%; padding:14px; font-size:1.1rem;">Proceed to Checkout</button>
    </div>
  </div>

  <!-- Checkout Modal -->
  <div class="checkout-modal-overlay" id="checkout-modal">
    <div class="checkout-modal">
      <div class="checkout-header">
        <h3 style="color:var(--primary); font-size:1.3rem;">Complete Your Order</h3>
        <button class="checkout-close" onclick="closeCheckoutModal()">×</button>
      </div>
      <div class="checkout-body">
        <form id="checkout-form">
          <div class="form-group">
            <label>Full Name *</label>
            <input type="text" id="chk-name" required placeholder="Enter your name">
          </div>
          <div class="form-group">
            <label>Phone Number *</label>
            <input type="tel" id="chk-phone" required placeholder="10-digit mobile number">
          </div>
          <div class="form-group">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.3rem;">
              <label style="margin-bottom:0;">Delivery Address *</label>
              <button type="button" id="btn-current-location" style="background:var(--primary-ultra-light); color:var(--primary); border:1px solid var(--primary); padding:2px 8px; border-radius:12px; font-size:0.75rem; font-weight:700; cursor:pointer; display:flex; align-items:center; gap:4px;">
                <span>📍</span> Auto-fill Location
              </button>
            </div>
            <textarea id="chk-address" rows="2" required placeholder="House No, Street, Landmark"></textarea>
          </div>
          <div class="form-grid" style="grid-template-columns: 1fr 1fr;">
            <div class="form-group">
              <label>City *</label>
              <input type="text" id="chk-city" required placeholder="City name">
            </div>
            <div class="form-group">
              <label>Pincode *</label>
              <input type="text" id="chk-pincode" required placeholder="6 digit pin">
            </div>
          </div>
          <div class="form-group" style="margin-top: 10px;">
            <label style="font-size:1.1rem; color:var(--primary); margin-bottom:12px;">Payment Mode</label>
            <div class="payment-options">
              <label class="payment-option">
                <input type="radio" name="payment_mode" value="COD" checked> Cash on Delivery (COD)
              </label>
              <label class="payment-option">
                <input type="radio" name="payment_mode" value="WhatsApp"> Pay via WhatsApp Support
              </label>
            </div>
          </div>
          <button type="submit" id="checkout-submit-btn" class="btn btn-primary" style="width:100%; font-size:1.1rem; margin-top:16px;">Place Order Now</button>
        </form>
      </div>
    </div>
  </div>

  <!-- Sticky Floating Cart Strip (Zepto style) -->
  <div id="sticky-cart-strip" style="display:none; position:fixed; bottom:70px; left:50%; transform:translateX(-50%); width:95%; max-width:600px; background:#1e4633; color:white; padding:12px 20px; border-radius:12px; z-index:900; align-items:center; justify-content:space-between; box-shadow:0 8px 24px rgba(0,0,0,0.2); cursor:pointer;" onclick="openCartDrawer()">
    <div style="display:flex; align-items:center; gap:12px;">
      <div style="background:rgba(255,255,255,0.2); padding:6px 12px; border-radius:8px; font-weight:700;">
        <span id="sticky-cart-qty">1</span> Item(s)
      </div>
      <div style="font-weight:700; font-size:1.1rem;" id="sticky-cart-total">₹0</div>
    </div>
    <div style="font-weight:700; display:flex; align-items:center; gap:6px;">
      View Cart 
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
    </div>
  </div>

  <!-- Bottom App Navigation -->
  <nav class="app-bottom-nav">
    <a href="#home" class="nav-btn active">
      <div class="nav-icon">🏠</div>
      <span>Home</span>
    </a>
    <a href="#categories" class="nav-btn" onclick="document.querySelector('.category-scroll').scrollIntoView({behavior: 'smooth'})">
      <div class="nav-icon">🗂️</div>
      <span>Categories</span>
    </a>
    <a href="#menu" class="nav-btn">
      <div class="nav-icon">☰</div>
      <span>Menu</span>
    </a>
    <a href="javascript:void(0)" class="nav-btn" onclick="openCartDrawer()">
      <div class="nav-icon" style="position:relative;">
        🛒
        <span class="nav-badge" id="cart-badge-count" style="position:absolute; top:-6px; right:-8px; background:#e91e63; color:#fff; border-radius:50%; width:16px; height:16px; font-size:0.6rem; display:flex; align-items:center; justify-content:center; font-weight:bold;">0</span>
      </div>
      <span>Cart</span>
    </a>
  </nav>

  <a href="https://wa.me/918796982661?text=Hello%20Unani%20Dawakhana,%20I%20would%20like%20to%20know%20more%20about%20your%20products." class="floating-whatsapp-btn" target="_blank" aria-label="Chat on WhatsApp">

  </a>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
